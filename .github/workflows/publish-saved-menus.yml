name: Publish verified saved menus
on:
  push:
    branches: [main]
    paths: ['app/data/public-menu-feed.json']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: campus-menu-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare public menu feed
        run: |
          mkdir -p public-menu-feed
          cp app/data/public-menu-feed.json public-menu-feed/menus.json
          printf '%s' 'Hillplate verified campus menus. No account or diary data is included.' > public-menu-feed/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-menu-feed
      - uses: actions/deploy-pages@v4
        id: publish
